<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal Sekolah</title>
<meta name="theme-color" content="#1f4fd8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%AB%3C/text%3E%3C/svg%3E">
<script>
  // Pasang tema sebelum halaman tampil supaya tidak berkedip
  (function(){
    var t = 'dark';
    try { t = localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); } catch(e){}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --teks:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --kertas:#f6f9ff; --kartu:#ffffff; --tinta:#0f1b3d; --tinta-2:#55648a;
    --garis-buku:#dbe5fa; --biru:#1f4fd8; --biru-muda:#e4ecff;
    --pensil:#ffc93c; --margin:#e5484d; --bayangan:rgba(31,79,216,.20);
    --memo:#fff3c4; --memo-garis:#e6cd6e; --titik:#b9c8ec;
  }
  [data-theme="dark"]{
    --kertas:#0a1226; --kartu:#121d3c; --tinta:#eaf0ff; --tinta-2:#93a2c8;
    --garis-buku:rgba(140,170,255,.075); --biru:#7a9dff; --biru-muda:rgba(122,157,255,.16);
    --pensil:#ffd35c; --margin:#ff6b70; --bayangan:rgba(0,0,0,.5);
    --memo:#35300f; --memo-garis:#6b5f1e; --titik:#33466f;
  }

  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--teks);font-size:16px;line-height:1.5;color:var(--tinta);
    background-color:var(--kertas);
    background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--garis-buku) 31px 32px);
    min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  body::before{ /* garis margin buku tulis */
    content:'';position:fixed;top:0;bottom:0;left:clamp(8px,calc(50% - 590px),9999px);
    width:2px;background:var(--margin);opacity:.35;z-index:-1;pointer-events:none;
  }
  .hidden{display:none!important}
  :focus-visible{outline:3px solid var(--pensil);outline-offset:3px;border-radius:6px}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- Tombol ---------- */
  .btn-ikon,.btn-keluar{
    display:inline-grid;place-items:center;height:42px;border-radius:12px;
    background:var(--kartu);border:2px solid var(--tinta);box-shadow:3px 3px 0 var(--bayangan);
    transition:transform .15s,box-shadow .15s;
  }
  .btn-ikon{width:42px}
  .btn-keluar{padding:0 16px;font-weight:600;font-size:.92rem}
  .btn-ikon:hover,.btn-keluar:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--bayangan)}
  .btn-ikon:active,.btn-keluar:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--bayangan)}
  .btn-ikon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .i-bulan{display:none}
  [data-theme="light"] .i-bulan{display:block}
  [data-theme="light"] .i-matahari{display:none}

  /* ---------- Login ---------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:28px 18px;position:relative}
  .tema-login{position:fixed;top:16px;right:16px}
  .kartu-login{
    width:100%;max-width:430px;background:var(--kartu);border:2px solid var(--tinta);
    border-radius:20px;box-shadow:8px 8px 0 var(--bayangan);padding:34px 30px 28px;text-align:center;
  }
  .sketsa{width:min(230px,70%);height:auto;margin:0 auto 14px;display:block;overflow:visible}
  .sketsa .g{
    fill:none;stroke:var(--tinta);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;animation:gambar .8s cubic-bezier(.5,0,.3,1) forwards;animation-delay:var(--d,0s);
  }
  .sketsa .isi{opacity:0;animation:isi .7s ease forwards;animation-delay:1.9s}
  .sketsa .isi-atap{fill:var(--biru)}
  .sketsa .isi-badan{fill:var(--biru-muda)}
  .sketsa .bendera{fill:var(--pensil);stroke:var(--tinta);stroke-width:2.2;stroke-linejoin:round;opacity:0;animation:isi .5s ease forwards;animation-delay:2.2s}
  @keyframes gambar{to{stroke-dashoffset:0}}
  @keyframes isi{to{opacity:1}}
  .judul-login{font-family:var(--display);font-weight:800;font-size:2.3rem;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px}
  .sub-login{color:var(--tinta-2);margin-bottom:24px;max-width:32ch;margin-inline:auto}
  #tombolGoogle{display:flex;justify-content:center;min-height:44px}
  .pesan-error{
    margin-top:18px;text-align:left;padding:12px 14px;font-size:.92rem;line-height:1.45;
    background:rgba(229,72,77,.1);border-left:4px solid var(--margin);border-radius:4px 10px 10px 4px;
  }
  .bantuan{margin-top:22px;font-size:.85rem;color:var(--tinta-2)}

  /* ---------- Header ---------- */
  header.bar{position:sticky;top:0;z-index:30;background:var(--kertas);border-bottom:2px solid var(--tinta)}
  .bar-isi{max-width:1100px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
  .mini{width:42px;height:42px;flex:none}
  .nama-sekolah{flex:1;min-width:0;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pengguna{display:flex;align-items:center;gap:10px;min-width:0}
  .avatar{width:42px;height:42px;border-radius:12px;border:2px solid var(--tinta);object-fit:cover;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:var(--biru);flex:none}
  [data-theme="dark"] .avatar{color:#0a1226}
  .pengguna-teks{display:flex;flex-direction:column;line-height:1.2;min-width:0}
  .pengguna-teks b{font-size:.92rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
  .pengguna-teks small{color:var(--tinta-2);font-size:.8rem}

  main{max-width:1100px;margin:0 auto;padding:34px 20px 24px}

  /* ---------- Hero: sapaan + lengkung hari sekolah ---------- */
  .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:34px;align-items:center;margin-bottom:46px}
  .tgl{color:var(--tinta-2);font-weight:500;margin-bottom:10px}
  #sapaan{font-family:var(--display);font-weight:800;font-size:clamp(2.1rem,5.4vw,3.7rem);line-height:1.04;letter-spacing:-.035em;margin-bottom:16px;text-wrap:balance}
  .info-peran{color:var(--tinta-2);max-width:40ch}
  .lengkung{background:var(--kartu);border:2px solid var(--tinta);border-radius:22px;box-shadow:6px 6px 0 var(--bayangan);padding:18px 18px 18px;text-align:center}
  .lengkung svg{width:100%;height:auto;display:block;overflow:visible}
  .arc-dasar{fill:none;stroke:var(--titik);stroke-width:10;stroke-linecap:round;stroke-dasharray:.1 17}
  .arc-prog{fill:none;stroke:var(--biru);stroke-width:10;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000}
  .arc-tik line{stroke:var(--tinta-2);stroke-width:2;stroke-linecap:round}
  .arc-tik text{font-family:var(--teks);font-size:13px;font-weight:600;fill:var(--tinta-2)}
  .arc-jam{font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:-.02em;fill:var(--tinta);font-variant-numeric:tabular-nums}
  .arc-matahari{fill:var(--pensil);stroke:var(--tinta);stroke-width:2.6}
  .arc-status{font-size:.92rem;color:var(--tinta-2);margin-top:6px;line-height:1.45;min-height:2.9em}

  /* ---------- Bagian ---------- */
  .seksi{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 18px}
  .seksi h2{font-family:var(--display);font-weight:800;font-size:1.65rem;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .hitung{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:99px;background:var(--biru);color:#fff;font-family:var(--teks);font-size:.85rem;font-weight:700}
  [data-theme="dark"] .hitung{color:#0a1226}
  .cari{position:relative;display:block}
  .cari svg{position:absolute;left:12px;top:50%;width:18px;height:18px;margin-top:-9px;fill:none;stroke:var(--tinta-2);stroke-width:2;stroke-linecap:round}
  .cari input{
    font:inherit;width:260px;max-width:100%;padding:10px 14px 10px 38px;color:var(--tinta);
    background:var(--kartu);border:2px solid var(--tinta);border-radius:12px;
  }
  .cari input::placeholder{color:var(--tinta-2)}

  /* ---------- Kartu aplikasi ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px;margin-bottom:56px}
  .app{
    --r:-4deg;position:relative;display:flex;align-items:center;gap:16px;overflow:hidden;
    padding:18px 18px 18px 28px;background:var(--kartu);border:2px solid var(--tinta);border-radius:16px;
    box-shadow:4px 4px 0 var(--bayangan);text-decoration:none;color:inherit;
    transition:transform .18s,box-shadow .18s;
    animation:cap .55s cubic-bezier(.2,.9,.3,1.25) backwards;animation-delay:calc(var(--i) * 70ms + 450ms);
  }
  .app:nth-child(even){--r:3deg}
  .app::before{content:'';position:absolute;left:0;top:0;bottom:0;width:10px;background:hsl(var(--h) 75% 55%);border-right:2px solid var(--tinta)}
  .app:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--bayangan)}
  .app:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--bayangan)}
  .app-ikon{
    width:56px;height:56px;flex:none;display:grid;place-items:center;font-size:1.8rem;border-radius:14px;
    background:hsl(var(--h) 90% 92%);border:2px solid var(--tinta);transform:rotate(var(--r));
    transition:transform .3s cubic-bezier(.3,1.7,.5,1);
  }
  [data-theme="dark"] .app-ikon{background:hsl(var(--h) 45% 26%)}
  .app:hover .app-ikon{transform:rotate(calc(var(--r) * -1)) scale(1.1)}
  .app-teks{min-width:0;flex:1}
  .app-teks b{
    font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;line-height:1.25;
    background:linear-gradient(var(--pensil),var(--pensil)) 0 88%/0 .42em no-repeat;transition:background-size .35s ease;
  }
  .app:hover .app-teks b{background-size:100% .42em}
  .app-teks small{display:block;margin-top:3px;color:var(--tinta-2);font-size:.9rem;line-height:1.4}
  .app-buka{width:20px;height:20px;flex:none;fill:none;stroke:var(--tinta-2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:translate(-4px,4px);transition:.2s}
  .app:hover .app-buka{opacity:1;transform:none}
  @keyframes cap{from{opacity:0;transform:scale(1.07) rotate(-1.4deg)}}

  .skel{height:92px;border-radius:16px;border:2px solid var(--garis-buku);background:linear-gradient(100deg,var(--kartu) 30%,var(--biru-muda) 50%,var(--kartu) 70%);background-size:220% 100%;animation:kilau 1.3s linear infinite}
  @keyframes kilau{to{background-position:-220% 0}}

  .kosong{padding:20px 22px;border:2px dashed var(--titik);border-radius:14px;color:var(--tinta-2);background:var(--kartu);grid-column:1/-1}

  /* ---------- Papan pengumuman ---------- */
  .papan{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 22px;padding-top:12px}
  .memo{
    --m:-.8deg;position:relative;background:var(--memo);border:2px solid var(--memo-garis);border-radius:6px 6px 16px 6px;
    padding:28px 22px 22px;box-shadow:4px 4px 0 var(--bayangan);transform:rotate(var(--m));transition:transform .25s;
  }
  .memo:nth-child(even){--m:.7deg}
  .memo:nth-child(3n){--m:-.3deg}
  .memo:hover{transform:rotate(0) translateY(-4px)}
  .memo::before{
    content:'';position:absolute;top:-10px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;
    background:var(--margin);border:2px solid var(--tinta);box-shadow:inset -3px -3px 0 rgba(0,0,0,.22);
  }
  .memo time{display:block;font-size:.82rem;font-weight:600;color:var(--tinta-2);margin-bottom:6px}
  .memo h3{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.2;letter-spacing:-.01em;margin-bottom:8px}
  .memo p{font-size:.96rem;line-height:1.6;white-space:pre-line}

  footer{max-width:1100px;margin:0 auto;padding:10px 20px 40px;color:var(--tinta-2);font-size:.85rem}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;gap:26px;margin-bottom:38px}
  }
  @media (max-width:560px){
    .pengguna-teks,.mini{display:none}
    .btn-keluar{padding:0 12px}
    .seksi h2{font-size:1.4rem}
    .cari,.cari input{width:100%}
    .kartu-login{padding:28px 20px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .sketsa .g{stroke-dashoffset:0}
    .sketsa .isi,.sketsa .bendera{opacity:1}
  }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gedung" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#1f4fd8"/>
    <path d="M32 13 10 27h44L32 13Z" fill="#fff"/>
    <rect x="14" y="29" width="36" height="22" fill="#fff"/>
    <rect x="28" y="38" width="8" height="13" fill="#1f4fd8"/>

<!-- ===================== LOGIN ===================== -->
<section id="login">
  <button class="btn-ikon tema-login" id="temaLogin" type="button" aria-label="Ganti tema terang atau gelap">
    <svg class="i-matahari" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-bulan" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
  </button>

  <div class="kartu-login">
    <svg class="sketsa" viewBox="0 0 120 100" role="img" aria-label="Gambar gedung sekolah">
      <path class="isi isi-badan" d="M20 46H100V86H20Z"/>
      <path class="isi isi-atap" d="M12 46 60 24 108 46Z"/>
      <path class="g" pathLength="1" style="--d:.0s" d="M6 86H114"/>
      <path class="g" pathLength="1" style="--d:.2s" d="M20 86V46"/>
      <path class="g" pathLength="1" style="--d:.35s" d="M100 86V46"/>
      <path class="g" pathLength="1" style="--d:.55s" d="M12 46 60 24 108 46Z"/>
      <path class="g" pathLength="1" style="--d:.9s" d="M52 86V64H68V86"/>
      <path class="g" pathLength="1" style="--d:1.1s" d="M28 56H42V70H28Z"/>
      <path class="g" pathLength="1" style="--d:1.25s" d="M78 56H92V70H78Z"/>
      <circle class="g" pathLength="1" style="--d:1.45s" cx="60" cy="38" r="6" />
      <path class="g" pathLength="1" style="--d:1.65s" d="M60 38V34M60 38H63.5"/>
      <path class="g" pathLength="1" style="--d:1.8s" d="M60 24V6"/>
      <path class="bendera" d="M60 6 78 12 60 18Z"/>
    </svg>
    <h1 class="judul-login">Portal Sekolah</h1>
    <p class="sub-login">Masuk dengan akun Google yang sudah didaftarkan sekolah.</p>
    <div id="tombolGoogle"></div>
    <div id="errorLogin" class="pesan-error hidden" role="alert"></div>
    <p class="bantuan">Belum bisa masuk? Minta admin sekolah mendaftarkan email Anda.</p>
  </div>
</section>

<!-- ===================== BERANDA ===================== -->
<section id="beranda" class="hidden">
  <header class="bar">
    <div class="bar-isi">
      <svg class="mini" aria-hidden="true"><use href="#gedung"/></svg>
      <div class="nama-sekolah" id="hNama">Memuat...</div>
      <div class="pengguna">
        <img id="foto" class="avatar hidden" alt="" referrerpolicy="no-referrer">
        <span id="inisial" class="avatar" aria-hidden="true">?</span>
        <span class="pengguna-teks"><b id="hNamaUser"></b><small id="hPeran"></small></span>
      </div>
      <button class="btn-ikon" id="temaBeranda" type="button" aria-label="Ganti tema terang atau gelap">
        <svg class="i-matahari" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-bulan" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="btn-keluar" id="btnKeluar" type="button">Keluar</button>
    </div>
  </header>

  <main>
    <div class="hero">
      <div>
        <p class="tgl" id="tanggal"></p>
        <h1 id="sapaan">Selamat datang</h1>
        <p class="info-peran" id="infoPeran"></p>
      </div>

      <div class="lengkung">
        <svg viewBox="0 0 400 240" role="img" aria-label="Lengkung hari sekolah: posisi matahari menunjukkan jam sekarang">
          <path class="arc-dasar" d="M60 215A140 140 0 0 1 340 215"/>
          <path class="arc-prog" id="arcProg" pathLength="1000" d="M60 215A140 140 0 0 1 340 215"/>
          <g class="arc-tik" id="arcTik"></g>
          <text class="arc-jam" id="arcJam" x="200" y="196" text-anchor="middle">00:00:00</text>
          <g id="arcMatahari" transform="translate(60 215)"><circle class="arc-matahari" r="14"/></g>
        </svg>
        <p class="arc-status" id="arcStatus"></p>
      </div>
    </div>

    <div class="seksi">
      <h2>Aplikasi <span class="hitung" id="hitungApp">0</span></h2>
      <label class="cari hidden" id="cariWrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="cari" type="search" placeholder="Cari aplikasi" autocomplete="off" aria-label="Cari aplikasi">
      </label>
    </div>
    <div class="grid" id="menu"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <p class="kosong hidden" id="tidakAda">Tidak ada aplikasi yang cocok. Coba kata kunci lain.</p>

    <div class="seksi">
      <h2>Papan pengumuman <span class="hitung" id="hitungAnn">0</span></h2>
    </div>
    <div class="papan" id="pengumuman"></div>
  </main>

  <footer id="footNama"></footer>
</section>

<script>
const $ = (id) => document.getElementById(id);
const KUNCI = 'portal_token';
const kurangiGerak = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const sesi = {
  get(){ try{ return sessionStorage.getItem(KUNCI); }catch(e){ return null; } },
  set(v){ try{ sessionStorage.setItem(KUNCI, v); }catch(e){} },
  hapus(){ try{ sessionStorage.removeItem(KUNCI); }catch(e){} }
};

/* ---------- Utilitas ---------- */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function urlAman(u){ return /^https?:\/\//i.test(u) ? u : '#'; }
const BULAN = {Jan:'Jan',Feb:'Feb',Mar:'Mar',Apr:'Apr',May:'Mei',Jun:'Jun',Jul:'Jul',Aug:'Agu',Sep:'Sep',Oct:'Okt',Nov:'Nov',Dec:'Des'};
function tglID(s){ return String(s || '').replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/, (m) => BULAN[m]); }

function tampil(nama){
  $('login').classList.toggle('hidden', nama !== 'login');
  $('beranda').classList.toggle('hidden', nama !== 'beranda');
  window.scrollTo(0, 0);
}
function errorLogin(teks){
  const el = $('errorLogin');
  el.textContent = teks || '';
  el.classList.toggle('hidden', !teks);
}

/* ---------- Tema ---------- */
function ubahTema(){
  const baru = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', baru);
  try{ localStorage.setItem('tema', baru); }catch(e){}
  renderTombol();
}
$('temaLogin').onclick = ubahTema;
$('temaBeranda').onclick = ubahTema;

/* ---------- Backend ---------- */
async function panggil(token){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    // text/plain menghindari preflight CORS yang tidak didukung Apps Script
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ aksi: 'beranda', token })
  });
  return res.json();
}

async function masuk(token){
  resetBeranda();
  tampil('beranda');
  try{
    const data = await panggil(token);
    if(!data.ok){
      sesi.hapus();
      tampil('login');
      errorLogin(data.error || 'Gagal masuk. Coba lagi.');
      return;
    }
    sesi.set(token);
    gambarBeranda(data);
  }catch(e){
    tampil('login');
    errorLogin('Tidak bisa terhubung ke server. Periksa internet Anda, lalu coba lagi.');
  }
}

/* ---------- Beranda ---------- */
const HUE = [222, 168, 350, 38, 280, 150, 200, 12];
let jumlahMenu = 0;

function resetBeranda(){
  clearInterval(timerJam);
  $('menu').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $('pengumuman').innerHTML = '';
  $('hNama').textContent = 'Memuat...';
  $('cari').value = '';
  $('cariWrap').classList.add('hidden');
  $('tidakAda').classList.add('hidden');
}

function gambarBeranda(d){
  const sekolah = d.sekolah || 'Portal Sekolah';
  document.title = 'Portal ' + sekolah;
  $('hNama').textContent = sekolah;
  $('footNama').textContent = 'Portal ' + sekolah;

  const nama = d.user.nama || d.user.email;
  $('hNamaUser').textContent = nama;
  $('hPeran').textContent = d.user.peran;
  $('inisial').textContent = (nama || '?').trim().charAt(0).toUpperCase();
  const foto = $('foto');
  if(d.user.foto){
    foto.onerror = () => { foto.classList.add('hidden'); $('inisial').classList.remove('hidden'); };
    foto.src = d.user.foto;
    foto.classList.remove('hidden');
    $('inisial').classList.add('hidden');
  }else{
    foto.classList.add('hidden');
    $('inisial').classList.remove('hidden');
  }

  const sekarang = new Date();
  const jam = sekarang.getHours();
  const salam = jam < 11 ? 'Selamat pagi' : jam < 15 ? 'Selamat siang' : jam < 18 ? 'Selamat sore' : 'Selamat malam';
  $('sapaan').textContent = salam + ', ' + String(nama).split(' ')[0];
  $('tanggal').textContent = sekarang.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

  jumlahMenu = d.menu.length;
  $('infoPeran').textContent = jumlahMenu
    ? 'Anda masuk sebagai ' + d.user.peran + '. ' + jumlahMenu + ' aplikasi siap dibuka.'
    : 'Anda masuk sebagai ' + d.user.peran + '. Belum ada aplikasi untuk peran ini.';

  $('hitungApp').textContent = jumlahMenu;
  $('menu').innerHTML = jumlahMenu
    ? d.menu.map((m, i) => `
      <a class="app" href="${esc(urlAman(m.url))}" target="_blank" rel="noopener" style="--i:${i};--h:${HUE[i % HUE.length]}" data-cari="${esc((m.judul + ' ' + (m.deskripsi || '')).toLowerCase())}">
        <span class="app-ikon" aria-hidden="true">${esc(m.ikon || '📌')}</span>
        <span class="app-teks"><b>${esc(m.judul)}</b><small>${esc(m.deskripsi)}</small></span>
        <svg class="app-buka" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>`).join('')
    : '<p class="kosong">Belum ada aplikasi untuk peran Anda. Minta admin menambahkannya di sheet menu.</p>';
  $('cariWrap').classList.toggle('hidden', jumlahMenu < 4);

  $('hitungAnn').textContent = d.pengumuman.length;
  $('pengumuman').innerHTML = d.pengumuman.length
    ? d.pengumuman.map((p) => `
      <article class="memo"><time>${esc(tglID(p.tanggal))}</time><h3>${esc(p.judul)}</h3><p>${esc(p.isi)}</p></article>`).join('')
    : '<p class="kosong" style="grid-column:1/-1">Belum ada pengumuman. Tambahkan baris baru di sheet pengumuman.</p>';

  mulaiLengkung();
}

/* ---------- Pencarian aplikasi ---------- */
$('cari').addEventListener('input', () => {
  const q = $('cari').value.trim().toLowerCase();
  let cocok = 0;
  document.querySelectorAll('#menu .app').forEach((a) => {
    const ok = !q || a.dataset.cari.indexOf(q) > -1;
    a.classList.toggle('hidden', !ok);
    if(ok) cocok++;
  });
  $('tidakAda').classList.toggle('hidden', cocok > 0 || jumlahMenu === 0);
});

/* ---------- Lengkung hari sekolah ---------- */
const CX = 200, CY = 215, R = 140;
let timerJam = null, arcBerjalan = false;

function titik(p){ const a = Math.PI * p; return [CX - R * Math.cos(a), CY - R * Math.sin(a)]; }
function setArc(p){
  const [x, y] = titik(p);
  $('arcMatahari').setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')');
  $('arcProg').style.strokeDashoffset = (1000 * (1 - p)).toFixed(1);
}
function bangunTik(){
  const g = $('arcTik'); g.innerHTML = '';
  const s = CONFIG.JAM_MASUK, e = CONFIG.JAM_PULANG;
  const daftar = [];
  for(let h = s; h <= e; h += 2) daftar.push(h);
  if(daftar[daftar.length - 1] !== e) daftar.push(e);
  daftar.forEach((h) => {
    const a = Math.PI * ((h - s) / (e - s)), c = Math.cos(a), si = Math.sin(a);
    g.insertAdjacentHTML('beforeend',
      '<line x1="' + (CX - 154 * c).toFixed(1) + '" y1="' + (CY - 154 * si).toFixed(1) + '" x2="' + (CX - 163 * c).toFixed(1) + '" y2="' + (CY - 163 * si).toFixed(1) + '"/>' +
      '<text x="' + (CX - 181 * c).toFixed(1) + '" y="' + (CY - 181 * si).toFixed(1) + '" text-anchor="middle" dominant-baseline="middle">' + String(h).padStart(2, '0') + '</text>');
  });
}
function durasi(menit){
  menit = Math.ceil(menit);
  const h = Math.floor(menit / 60), m = menit % 60;
  return h ? h + ' jam ' + m + ' menit' : m + ' menit';
}
function jamTeks(h){ return String(h).padStart(2, '0') + ':00'; }
function statusHari(now){
  const m = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  const s = CONFIG.JAM_MASUK * 60, e = CONFIG.JAM_PULANG * 60;
  if(CONFIG.HARI_LIBUR.indexOf(now.getDay()) > -1) return { p: 0, teks: 'Hari ini libur. Selamat beristirahat.' };
  if(m < s) return { p: 0, teks: 'Sekolah dibuka pukul ' + jamTeks(CONFIG.JAM_MASUK) + ', ' + durasi(s - m) + ' lagi.' };
  if(m >= e) return { p: 1, teks: 'Jam sekolah hari ini sudah selesai.' };
  return { p: (m - s) / (e - s), teks: 'Jam sekolah berlangsung. Pulang pukul ' + jamTeks(CONFIG.JAM_PULANG) + ', ' + durasi(e - m) + ' lagi.' };
}
function detak(){
  const n = new Date();
  $('arcJam').textContent = [n.getHours(), n.getMinutes(), n.getSeconds()].map((v) => String(v).padStart(2, '0')).join(':');
  const st = statusHari(n);
  $('arcStatus').textContent = st.teks;
  if(!arcBerjalan) setArc(st.p);
}
function mulaiLengkung(){
  bangunTik();
  clearInterval(timerJam);
  setArc(0);
  const target = statusHari(new Date()).p;
  if(kurangiGerak() || target === 0){
    arcBerjalan = false;
  }else{
    arcBerjalan = true;
    const mulai = performance.now() + 450, lama = 2000;
    const f = (t) => {
      const k = Math.min(1, Math.max(0, (t - mulai) / lama));
      setArc(target * (1 - Math.pow(1 - k, 3)));
      if(k < 1) requestAnimationFrame(f); else arcBerjalan = false;
    };
    requestAnimationFrame(f);
  }
  detak();
  timerJam = setInterval(detak, 1000);
}

/* ---------- Keluar ---------- */
$('btnKeluar').onclick = () => {
  sesi.hapus();
  clearInterval(timerJam);
  if(window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  errorLogin('');
  tampil('login');
};

/* ---------- Google Sign-In ---------- */
let googleSiap = false;
function renderTombol(){
  if(!googleSiap) return;
  const el = $('tombolGoogle');
  el.innerHTML = '';
  google.accounts.id.renderButton(el, {
    theme: document.documentElement.getAttribute('data-theme') === 'dark' ? 'filled_black' : 'outline',
    size: 'large', text: 'signin_with', shape: 'rectangular', locale: 'id', width: 300
  });
}
function mulaiGoogle(){
  if(!(window.google && google.accounts && google.accounts.id)){ setTimeout(mulaiGoogle, 200); return; }
  google.accounts.id.initialize({
    client_id: CONFIG.CLIENT_ID,
    callback: (r) => { errorLogin(''); masuk(r.credential); },
    auto_select: true
  });
  googleSiap = true;
  renderTombol();
}

/* ---------- Mulai ---------- */
(function(){
  const tersimpan = sesi.get();
  if(tersimpan) masuk(tersimpan); else tampil('login');
  mulaiGoogle();
})();
</script>
